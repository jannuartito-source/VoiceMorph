name: Build Windows installer

# The point of this workflow: you do not need Visual Studio, CMake or Inno
# Setup on your own machine. Push a commit, wait about ten minutes, and
# download the finished .exe from the Actions tab.

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      enable_neural:
        description: 'Build the neural conversion stage (slower, needs ONNX Runtime)'
        type: boolean
        default: false

env:
  ONNX_VERSION: '1.17.0'
  BUILD_TYPE: Release

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # ---------------------------------------------------------------
      # ONNX Runtime. Off by default: a plain DSP build has far fewer
      # moving parts, so get that working first. Turn the neural stage on
      # from the "Run workflow" button once it does.
      # ---------------------------------------------------------------
      - name: Decide whether to build the neural stage
        id: neural
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "enabled=${{ inputs.enable_neural }}" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch ONNX Runtime
        if: steps.neural.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $name = "onnxruntime-win-x64-$env:ONNX_VERSION"
          $url  = "https://github.com/microsoft/onnxruntime/releases/download/v$env:ONNX_VERSION/$name.zip"
          Invoke-WebRequest -Uri $url -OutFile ort.zip
          Expand-Archive ort.zip -DestinationPath third_party
          "ORT_ROOT=$PWD\third_party\$name" | Out-File -FilePath $env:GITHUB_ENV -Append

      # ---------------------------------------------------------------
      # Build
      # ---------------------------------------------------------------
      - name: Cache JUCE
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: juce-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure
        shell: pwsh
        run: |
          # Note: do not name this $args. That is a PowerShell automatic
          # variable, and splatting it silently passes nothing to cmake.
          $cmakeArgs = @(
            '-B', 'build',
            '-G', 'Visual Studio 17 2022',
            '-A', 'x64',
            '-DVM_COPY_PLUGIN=OFF'
          )
          if ('${{ steps.neural.outputs.enabled }}' -eq 'true') {
            $cmakeArgs += '-DVM_ENABLE_ONNX=ON'
            $cmakeArgs += "-DVM_ONNXRUNTIME_ROOT=$env:ORT_ROOT"
          }
          Write-Host "Running: cmake $($cmakeArgs -join ' ')"
          cmake @cmakeArgs
          if ($LASTEXITCODE -ne 0) { throw "CMake configure failed" }

      - name: Build
        run: cmake --build build --config Release --parallel

      # ---------------------------------------------------------------
      # Package
      # ---------------------------------------------------------------
      - name: Stage the ONNX Runtime DLL for the installer
        if: steps.neural.outputs.enabled == 'true'
        shell: pwsh
        run: Copy-Item "$env:ORT_ROOT\lib\onnxruntime.dll" installer\

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build the installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\VoiceMorph.iss

      # ---------------------------------------------------------------
      # Publish
      # ---------------------------------------------------------------
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: VoiceMorph-Windows-Setup
          path: dist/*.exe
          if-no-files-found: error

      - name: Upload raw binaries
        uses: actions/upload-artifact@v4
        with:
          name: VoiceMorph-Windows-Binaries
          path: |
            build/VoiceMorph_artefacts/Release/Standalone/VoiceMorph.exe
            build/VoiceMorph_artefacts/Release/VST3/**
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          body: |
            Unsigned build. Windows SmartScreen will warn on first run:
            choose **More info** then **Run anyway**.
